// ─── SUPABASE HELPERS ────────────────────────────────────────────────────────
async function sbReq(path,method="GET",body=null){
  const opts={method,headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  try{const r=await fetch(SB_URL+path,opts);if(!r.ok)return null;const t=await r.text();return t?JSON.parse(t):true;}catch{return null;}
}
const sbGet=(path)=>sbReq(path);
const sbPost=(path,body)=>sbReq(path,"POST",body);
const sbDelete=(path)=>sbReq(path,"DELETE");
const sbPatch=(path,body)=>sbReq(path,"PATCH",body);

// ─── WEEK HELPERS ────────────────────────────────────────────────────────────
function getMonday(d){const dt=new Date(d);const day=dt.getDay();const diff=dt.getDate()-day+(day===0?-6:1);return new Date(dt.setDate(diff));}
function dateToStr(d){return d.toISOString().split("T")[0];}
function currentWeekStart(){return dateToStr(getMonday(new Date()));}

// First game week is 8th June 2026
const GAME_START=new Date("2026-06-08");

function isBeforeGameStart(){return new Date()<GAME_START;}

function isMaintenance(){
  const now=new Date();
  const day=now.getDay(); // 0=Sun,1=Mon
  const h=now.getHours(),m=now.getMinutes();
  // Sunday 22:00 onwards
  if(day===0&&(h>=22))return true;
  // Monday before 09:00
  if(day===1&&(h<9))return true;
  return false;
}

function getGameWeekStart(){
  const now=new Date();
  const anchor=new Date("2026-06-08T00:00:00");
  if(now<anchor)return anchor;
  const diffMs=now-anchor;
  const diffWeeks=Math.floor(diffMs/(7*24*60*60*1000));
  const ws=new Date(anchor);
  ws.setDate(anchor.getDate()+diffWeeks*7);
  return ws;
}

function formatWeekBadge(){
  const d=getGameWeekStart();
  return"Game week — "+d.toLocaleDateString("en-GB",{day:"numeric",month:"long"});
}

function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

// ─── LOCAL STORAGE ───────────────────────────────────────────────────────────
function dbGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function dbSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

// ─── DEFAULT QUESTIONS ───────────────────────────────────────────────────────
const DQ=[

  {type:"tf",text:"Keeping your vehicle clean has no effect on your Bolt driver rating.",answer:"False",exp:"Cleanliness is rated by passengers and directly affects your overall score.",pts:10},
  {type:"mc",text:"Your passenger's pickup pin is slightly wrong. What do you do?",options:["Cancel and mark no-show","Call the passenger to confirm location","Drive around until you find them"],answer:1,exp:"Always call before cancelling to protect both parties.",pts:20},
  {type:"tf",text:"A fraudster can take over a Bolt account by convincing a driver to share their OTP.",answer:"True",exp:"Social engineering is the most common fraud method on the platform.",pts:20},
  {type:"mc",text:"Which 2FA method is most secure for the Bolt app?",options:["SMS OTP","In-app biometric (fingerprint or face ID)","Security question"],answer:1,exp:"Biometric verification is phishing-resistant and cannot be intercepted like OTPs.",pts:30},
  {type:"tf",text:"If a passenger leaves an item in your vehicle, you are not obligated to help retrieve it.",answer:"False",exp:"Assisting with lost items is part of excellent service and impacts your rating.",pts:20},
  {type:"mc",text:"What does a high acceptance rate mean for a Bolt driver?",options:["No impact on standing","Can unlock bonuses and priority trips","Only matters during busy hours"],answer:1,exp:"High acceptance signals reliability and can unlock better trip opportunities.",pts:20},
  {type:"tf",text:"SIM swap fraud lets a criminal receive your OTP on their own phone.",answer:"True",exp:"Criminals can hijack your number via SIM swap to intercept all SMS including OTPs.",pts:30},

  {type:"tf",text:"A driver can share their vehicle with another driver without notifying Bolt.",answer:"False",exp:"All drivers must be registered and verified by Bolt independently.",pts:20},

  {type:"tf",text:"Bolt drivers are allowed to negotiate fares directly with passengers.",answer:"False",exp:"All fares are set by the Bolt algorithm. Negotiating outside the app violates policy.",pts:20},
];

// ─── STATE ───────────────────────────────────────────────────────────────────
let Qs,Pf,sc="home",playerName="",playerCity="",cityErr="",pin="",pinErr=false,atab="add";
let GQs=[],gI=0,gS=0,gC=0,gSt=0,gH=[],gAn=false,gTL=25,gFB=null,opts={};
let saving=false,nameErr="";
let LB=[],lbLoading=false,lbErr=false;
let monthlyLB=[],monthlyLoading=false;
let lbTab="weekly";
let eidx=null,eq=null;
let af={type:"tf",text:"",tfa:"True",a:"",b:"",c:"",mca:0,exp:"",pts:10};
let amsg=null,emsg=null;
let tmr=null,sR=0,cR=0,stR=0,hR=[],tlR=25;
let currentRound=0; // 1,2,3
let completedRounds={}; // {1:{score,correct,total,accuracy}, 2:..., 3:...}
let weekQs={1:[],2:[],3:[]}; // questions per round loaded from supabase
let weekQsLoading=false;
let adminRoundTab=1;
let adminRoundQs={1:[],2:[],3:[]};
let publishMsg=null;

// ─── INIT ────────────────────────────────────────────────────────────────────
async function init(){
  Qs=dbGet(KQ)||DQ;
  Pf=dbGet(KP)||{};
  // Restore name and city from last session
  const savedName=dbGet("biq_player_name");
  const savedCity=dbGet("biq_player_city");
  const savedWeek=dbGet("biq_player_week");
  const thisWeek=currentWeekStart();
  if(savedName&&savedCity&&savedWeek===thisWeek){
    playerName=savedName;
    playerCity=savedCity;
  }
  await loadCompletedRounds();

function go(s){sc=s;window.scrollTo(0,0);render();}

// ─── COMPLETED ROUNDS ────────────────────────────────────────────────────────
async function loadCompletedRounds(){
  if(!playerName)return;
  const ws=currentWeekStart();
  const data=await sbGet(`/rest/v1/rounds?driver_name=eq.${encodeURIComponent(playerName)}&week_start=eq.${ws}&select=*`);
  completedRounds={};
  if(data&&Array.isArray(data)){
    data.forEach(r=>{completedRounds[r.round_number]={score:r.score,correct:r.correct,total:r.total,accuracy:r.accuracy};});
  }
}

// ─── WEEK QUESTIONS ──────────────────────────────────────────────────────────
async function loadWeekQuestions(){
  const ws=currentWeekStart();
  weekQsLoading=true;
  for(let r=1;r<=3;r++){
    const data=await sbGet(`/rest/v1/weekly_questions?week_start=eq.${ws}&round_number=eq.${r}&select=questions`);
    if(data&&data.length>0&&data[0].questions){weekQs[r]=data[0].questions;}
    else{
      // fallback to default questions sliced per round
      const sizes={1:10,2:15,3:20};
      weekQs[r]=Qs.slice(0,Math.min(sizes[r],Qs.length));
    }
  }
  weekQsLoading=false;
}

async function publishRoundQuestions(roundNum){
  const ws=currentWeekStart();
  const qs=adminRoundQs[roundNum];
  if(!qs||qs.length===0){publishMsg={t:"er",r:roundNum,msg:"No questions set for this round."};render();return;}
  const sizes={1:10,2:15,3:20};
  if(qs.length<sizes[roundNum]){publishMsg={t:"er",r:roundNum,msg:`Round ${roundNum} needs at least ${sizes[roundNum]} questions. You have ${qs.length}.`};render();return;}
  // Check if exists
  const existing=await sbGet(`/rest/v1/weekly_questions?week_start=eq.${ws}&round_number=eq.${roundNum}&select=id`);
  let ok;
  if(existing&&existing.length>0){
    ok=await sbPatch(`/rest/v1/weekly_questions?week_start=eq.${ws}&round_number=eq.${roundNum}`,{questions:qs});
  }else{
    ok=await sbPost("/rest/v1/weekly_questions",{week_start:ws,round_number:roundNum,questions:qs});
  }
  if(ok!==null){
    publishMsg={t:"ok",r:roundNum,msg:`Round ${roundNum} questions published for ${formatWeekBadge()}.`};
    weekQs[roundNum]=qs;
  }else{
    publishMsg={t:"er",r:roundNum,msg:"Publish failed. Check connection."};
  }
  render();setTimeout(()=>{publishMsg=null;render();},3000);
}

// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
async function loadLB(){
  lbLoading=true;lbErr=false;render();
  const ws=currentWeekStart();
  // Weekly: sum of all rounds for current week per driver
  const data=await sbGet(`/rest/v1/rounds?week_start=eq.${ws}&select=driver_name,city,score,round_number&order=score.desc`);
  if(data){
    // Aggregate by driver
    const map={};
    data.forEach(r=>{
      if(!map[r.driver_name])map[r.driver_name]={name:r.driver_name,city:r.city||"",total:0,rounds:0};
      map[r.driver_name].total+=r.score;
      map[r.driver_name].rounds++;
      if(r.city)map[r.driver_name].city=r.city;
    });
    LB=Object.values(map).sort((a,b)=>b.total-a.total);
    lbErr=false;
  }else{lbErr=true;}
  lbLoading=false;render();
}

async function loadMonthlyLB(){
  monthlyLoading=true;render();
  // Get current month start and end
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const monthEnd=new Date(now.getFullYear(),now.getMonth()+1,0);
  const msStr=dateToStr(monthStart);
  const meStr=dateToStr(monthEnd);
  const data=await sbGet(`/rest/v1/rounds?week_start=gte.${msStr}&week_start=lte.${meStr}&select=driver_name,score`);
  if(data){
    const map={};
    data.forEach(r=>{
      if(!map[r.driver_name])map[r.driver_name]={name:r.driver_name,total:0};
      map[r.driver_name].total+=r.score;
    });
    monthlyLB=Object.values(map).sort((a,b)=>b.total-a.total);
  }
  monthlyLoading=false;render();
}

async function deleteFromLB(name){
  if(!confirm(`Delete "${name}" from the leaderboard? This cannot be undone.`))return;
  const ws=currentWeekStart();
  await sbDelete(`/rest/v1/rounds?driver_name=eq.${encodeURIComponent(name)}&week_start=eq.${ws}`);
  await loadLB();
}

async function deleteFromMonthlyLB(name){
  if(!confirm(`Delete all scores for "${name}" this month? This cannot be undone.`))return;
  const now=new Date();
  const monthStart=dateToStr(new Date(now.getFullYear(),now.getMonth(),1));
  const monthEnd=dateToStr(new Date(now.getFullYear(),now.getMonth()+1,0));
  await sbDelete(`/rest/v1/rounds?driver_name=eq.${encodeURIComponent(name)}&week_start=gte.${monthStart}&week_start=lte.${monthEnd}`);
  await loadMonthlyLB();
}

// ─── GAME LOGIC ───────────────────────────────────────────────────────────────
function startRound(roundNum){
  if(completedRounds[roundNum])return;
  currentRound=roundNum;
  const sizes={1:10,2:15,3:20};
  const pool=weekQs[roundNum]&&weekQs[roundNum].length>0?weekQs[roundNum]:Qs;
  // Same questions, shuffled order
  const shuffled=[...pool].sort(()=>Math.random()-.5).slice(0,sizes[roundNum]);
  GQs=shuffled;
  sR=0;cR=0;stR=0;hR=[];gI=0;gS=0;gC=0;gSt=0;gH=[];gAn=false;gFB=null;opts={};saving=false;
  go("game");runTmr();
}

function runTmr(){
  clearInterval(tmr);tlR=30;gTL=30;
  tmr=setInterval(()=>{tlR--;gTL=tlR;updTimer();if(tlR<=0){clearInterval(tmr);hTO();}},1000);
}

function updTimer(){
  const el=document.getElementById("timer");
  if(el){el.textContent=gTL;el.style.borderColor=gTL<=5?"#ef4444":G;el.style.color=gTL<=5?"#ef4444":G;}
}

function hTO(){
  const q=GQs[gI];const cA=q.type==="tf"?q.answer:q.options[q.answer];
  const no={};
  if(q.type==="tf")["True","False"].forEach(v=>{if(v===q.answer)no[v]="ok";});
  else q.options.forEach((_,i)=>{if(i===q.answer)no[i]="ok";});
  opts=no;stR=0;gSt=0;
  const np={...Pf};const oi=Qs.findIndex(x=>x.text===q.text);
  if(oi>=0){if(!np[oi])np[oi]={correct:0,wrong:0};np[oi].wrong++;spf(np);}
  hR=[...hR,{question:q.text,playerAnswer:null,correctAnswer:cA,result:"to",exp:q.exp}];
  gH=[...hR];gAn=true;gFB={t:"to",msg:`Time's up! Correct: ${cA}${q.exp?" — "+q.exp:""}`};
  render();
}

function ans(val){
  if(gAn)return;clearInterval(tmr);
  const q=GQs[gI];const ok=val===q.answer;
  const cA=q.type==="tf"?q.answer:q.options[q.answer];
  const pA=q.type==="tf"?val:q.options[val];
  const no={};
  if(q.type==="tf")["True","False"].forEach(v=>{if(v===q.answer)no[v]="ok";else if(v===val&&!ok)no[v]="no";});
  else q.options.forEach((_,i)=>{if(i===q.answer)no[i]="ok";else if(i===val&&!ok)no[i]="no";});
  opts=no;
  const np={...Pf};const oi=Qs.findIndex(x=>x.text===q.text);
  if(oi>=0){if(!np[oi])np[oi]={correct:0,wrong:0};ok?np[oi].correct++:np[oi].wrong++;spf(np);}
  if(ok){
    const tb=tlR>=10?1:tlR>=5?.7:.5;const sb=stR>=3?1.5:stR>=2?1.25:1;
    const er=Math.round(q.pts*tb*sb);
    sR+=er;cR++;stR++;gS=sR;gC=cR;gSt=stR;
    gFB={t:"ok",msg:`Correct!${stR>=3?` 🔥 ${stR}x streak!`:""} +${er} pts. ${q.exp||""}`};
  }else{
    stR=0;gSt=0;
    gFB={t:"no",msg:`Incorrect. Correct: ${cA}${q.exp?" — "+q.exp:""}`};
  }
  hR=[...hR,{question:q.text,playerAnswer:pA,correctAnswer:cA,result:ok?"ok":"no",exp:q.exp}];
  gH=[...hR];gAn=true;render();
}

async function nextQ(){
  const ni=gI+1;
  if(ni>=GQs.length){
    const tot=GQs.length,acc=Math.round((cR/tot)*100);
    saving=true;render();
    const ws=currentWeekStart();
    await sbPost("/rest/v1/rounds",{driver_name:playerName,city:playerCity,week_start:ws,round_number:currentRound,score:sR,correct:cR,total:tot,accuracy:acc});
    completedRounds[currentRound]={score:sR,correct:cR,total:tot,accuracy:acc};
    saving=false;
    go("result");return;
  }
  gI=ni;gAn=false;gFB=null;opts={};render();runTmr();
}

          <option value="10" ${eq.pts===10?"selected":""}>10</option>
          <option value="20" ${eq.pts===20?"selected":""}>20</option>
          <option value="30" ${eq.pts===30?"selected":""}>30</option>
        </select>
        ${emsg==="er"?'<div class="al-er">Fill all fields.</div>':emsg==="ok"?'<div class="al-ok">✓ Updated.</div>':""}
        <button class="btn-p" onclick="saveEdit()">Save changes</button>
        <button class="btn-s" onclick="eidx=null;eq=null;emsg=null;render()">Cancel</button>
      </div>
    </div>`:""}`;
    return;
  }

  // ── GAME ──
  if(sc==="game"){
    const curQ=GQs[gI];
    const optHtml=curQ.type==="tf"?
      ["True","False"].map(v=>`<button class="opt ${opts[v]==="ok"?"opt-ok":opts[v]==="no"?"opt-no":""}" ${gAn?"disabled":""} onclick="ans('${v}')">${v}</button>`).join(""):
      curQ.options.map((o,i)=>`<button class="opt ${opts[i]==="ok"?"opt-ok":opts[i]==="no"?"opt-no":""}" ${gAn?"disabled":""} onclick="ans(${i})"><strong style="margin-right:6px">${String.fromCharCode(65+i)}.</strong>${o}</button>`).join("");

    app.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem">
      <div>
        <span style="font-size:12px;color:#777">Round ${currentRound} · Q </span>
        <span style="font-size:13px;font-weight:800">${gI+1} of ${tot}</span>
        ${gSt>=2?`<span class="streak">🔥 ${gSt}x streak</span>`:""}
      </div>
      <div id="timer" class="timer" style="border:3px solid ${G};color:${G}">${gTL}</div>
    </div>
    <div class="progress"><div class="progress-bar" style="width:${Math.round((gI/tot)*100)}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:.9rem;font-size:13px;color:#666">
      <span>Score: <strong style="color:${G};font-size:16px">${gS}</strong></span>
      <span style="font-weight:700;color:#333">${playerName}</span>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:.85rem">
        ${bdg(curQ.type==="tf"?"tf":"mc",curQ.type==="tf"?"True / False":"Multiple choice")}
        <span style="font-size:11px;color:#888">${curQ.pts} pts</span>
      </div>
      <p style="font-size:15px;font-weight:700;line-height:1.6;margin-bottom:1rem">${curQ.text}</p>
      ${optHtml}
    </div>
    ${gFB?`<div class="fb fb-${gFB.t}"><strong>${gFB.t==="ok"?"✓ ":gFB.t==="to"?"⏱ ":"✗ "}</strong>${gFB.msg}</div>`:""}
    ${gAn?`<button class="btn-p" ${saving?"disabled":""} onclick="nextQ()">${saving?"Saving…":gI+1>=tot?"🏁 Finish round":"Next question →"}</button>`:""}`;
    return;
  }

  // ── RESULT ──
  if(sc==="result"){
    const roundScore=completedRounds[currentRound]||{score:sR,correct:cR,total:GQs.length,accuracy:acc};
    const weeklyTotal=Object.values(completedRounds).reduce((s,r)=>s+r.score,0);
    const doneCount=Object.keys(completedRounds).length;
    const allDone=doneCount===3;
    const remaining=3-doneCount;

    const roundSummary=[1,2,3].map(r=>{
      const d=completedRounds[r];
      if(!d)return`<div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #f0f5f0;font-size:13px;color:#aaa"><span>Round ${r}</span><span>Not played yet</span></div>`;
      return`<div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #f0f5f0;font-size:13px"><span style="font-weight:600">Round ${r}</span><span>${d.correct}/${d.total} correct</span><span style="font-weight:800;color:#39B54A">${d.score} pts</span></div>`;
    }).join("");

    app.innerHTML=`
    ${hdr("Round "+currentRound+" complete!")}
    <div class="stat-grid">
      <div class="stat"><div style="font-size:28px;font-weight:800;color:${G};line-height:1.1">${roundScore.score}</div><div style="font-size:10px;color:#666;margin-top:4px;font-weight:700;text-transform:uppercase">Round score</div></div>
      <div class="stat"><div style="font-size:28px;font-weight:800;line-height:1.1">${roundScore.correct}/${roundScore.total}</div><div style="font-size:10px;color:#666;margin-top:4px;font-weight:700;text-transform:uppercase">Correct</div></div>
      <div class="stat"><div style="font-size:28px;font-weight:800;line-height:1.1">${roundScore.accuracy}%</div><div style="font-size:10px;color:#666;margin-top:4px;font-weight:700;text-transform:uppercase">Accuracy</div></div>
      <div class="stat"><div style="font-size:28px;font-weight:800;color:${G};line-height:1.1">${weeklyTotal}</div><div style="font-size:10px;color:#666;margin-top:4px;font-weight:700;text-transform:uppercase">Weekly total</div></div>
    </div>
    <div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:.75rem;color:#333">All rounds this week</div>${roundSummary}</div>
    <div class="card"><p style="font-size:14px;color:#555;line-height:1.65">${allDone?"🏆 All 3 rounds complete! Your weekly total is "+weeklyTotal+" pts. Check back next Monday for a new set of questions.":`📋 ${remaining} round${remaining>1?"s":""} remaining — complete all 3 to maximise your weekly score!`}</p></div>
    <button class="btn-p" onclick="go('review')">📋 Review my answers</button>
    <button class="btn-s" onclick="go('lb');loadLB()">🏆 View leaderboard</button>
    <button class="btn-g" onclick="go('home')">↩ Back to rounds</button>`;
    return;
  }

  // ── REVIEW ──
  if(sc==="review"){
    const rows=gH.map((h,i)=>`<div class="ri ri-${h.result}">
      <div style="font-size:13px;font-weight:700;margin-bottom:.4rem;line-height:1.45">${i+1}. ${h.question}</div>
      <div style="font-size:12px;color:#555;line-height:1.6">
        ${h.result==="to"?'<span style="color:#b45309;font-weight:700">⏱ Timed out</span>':`Your answer: <strong>${h.playerAnswer}</strong>`}
        ${h.result!=="ok"?`<br/>Correct: <strong style="color:#15803d">${h.correctAnswer}</strong>`:""}
        ${h.result==="ok"?'<br/><strong style="color:#15803d">✓ Correct!</strong>':""}
        ${h.exp?`<br/><em style="color:#777;font-size:12px">${h.exp}</em>`:""}
      </div>
    </div>`).join("");
    app.innerHTML=`
    ${hdr("Round "+currentRound+" — Answer review")}
    ${rows}
    <button class="btn-s" onclick="go('lb');loadLB()">🏆 Leaderboard</button>
    <button class="btn-g" onclick="go('result')">← Back to results</button>`;
    return;
  }

  // ── LEADERBOARD ──
  if(sc==="lb"){
    const wRows=lbLoading?'<div class="lb-loading">⏳ Loading scores…</div>':
      lbErr?'<div class="lb-err">Could not load scores. Try refreshing.</div>':
      LB.length===0?'<div style="text-align:center;padding:2.5rem;color:#999">No scores yet — be the first!</div>':
      LB.map((e,i)=>`<div class="lbr">
        <span style="width:30px;font-weight:800;color:#999">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span>
        <span style="flex:1;font-weight:600">${e.name}</span>
        <span style="font-size:11px;color:#888">${e.city||""} · ${e.rounds}/3 rounds</span>
        <span style="font-weight:800;color:#39B54A;min-width:56px;text-align:right">${e.total} pts</span>
      </div>`).join("");

    const mRows=monthlyLoading?'<div class="lb-loading">⏳ Loading…</div>':
      monthlyLB.length===0?'<div style="text-align:center;padding:2rem;color:#999">No monthly scores yet.</div>':
      monthlyLB.map((e,i)=>`<div class="lbr">
        <span style="width:30px;font-weight:800;color:#999">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span>
        <span style="flex:1;font-weight:600">${e.name}</span>
        <span style="font-weight:800;color:#39B54A;min-width:56px;text-align:right">${e.total} pts</span>
      </div>`).join("");

    app.innerHTML=`
    ${hdr("Live rankings")}
    <div class="monthly-tab">
      <button class="mtab ${lbTab==="weekly"?"mtab-on":"mtab-off"}" onclick="lbTab='weekly';loadLB()">This week</button>
      <button class="mtab ${lbTab==="monthly"?"mtab-on":"mtab-off"}" onclick="lbTab='monthly';loadMonthlyLB()">This month</button>
    </div>
    ${lbTab==="weekly"?`<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <span style="font-size:13px;font-weight:700">🏆 Weekly <span class="lb-live">● LIVE</span></span>
        <button class="btn-sm" style="background:#e8f7ea;color:#1e7a2e;border-color:#b7e4bf" onclick="loadLB()">↻ Refresh</button>
      </div>${wRows}</div>`:""}
    ${lbTab==="monthly"?`<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <span style="font-size:13px;font-weight:700">🏆 Monthly <span class="lb-live">● LIVE</span></span>
        <button class="btn-sm" style="background:#e8f7ea;color:#1e7a2e;border-color:#b7e4bf" onclick="loadMonthlyLB()">↻ Refresh</button>
      </div>${mRows}</div>`:""}
    <button class="btn-g" onclick="go('home')">← Back to home</button>`;
    return;
  }
}

async function confirmName(){
  const inp=document.getElementById("inp-name");
  const cityInp=document.getElementById("inp-city");
  const val=inp?inp.value.trim():"";
  const city=cityInp?cityInp.value:"";
  const parts=val.split(/\s+/).filter(Boolean);
  let hasErr=false;
  if(parts.length<2){nameErr="Enter your full name as on your Bolt account to continue.";hasErr=true;}
  else if(parts.length>5){nameErr="Name seems too long — please enter your full name only.";hasErr=true;}
  if(!city){cityErr="Please select your city to continue.";hasErr=true;}
  if(hasErr){render();return;}
  playerName=val;
  playerCity=city;
  nameErr="";cityErr="";
  // Save to localStorage so driver doesn't re-enter on return
  dbSet("biq_player_name",val);
  dbSet("biq_player_city",city);
  dbSet("biq_player_week",currentWeekStart());
  await loadCompletedRounds();
  render();
}

init();
</script>
</body>
</html>
